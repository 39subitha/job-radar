name: Daily job search

on:
  schedule:
    - cron: "30 2 * * *"   # 08:00 India time, every day
  workflow_dispatch:
    inputs:
      email_all:
        description: "Email all open jobs (not only new ones)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency: daily-jobs

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Collect jobs and send email
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          ADZUNA_APP_ID: ${{ secrets.ADZUNA_APP_ID }}
          ADZUNA_APP_KEY: ${{ secrets.ADZUNA_APP_KEY }}
          JOOBLE_KEY: ${{ secrets.JOOBLE_KEY }}
        run: python backend/run.py ${{ inputs.email_all && '--email-all' || '' }}
      - name: Save job list
        run: |
          git config user.name "job-radar-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/jobs.json
          git diff --cached --quiet || git commit -m "Daily jobs $(date -u +%F)"
          git push
